# Supply-chain hardening: refuse to install any version published less than
# 24h ago (default in pnpm 11; set explicitly to document the policy and to
# protect pnpm 10.16+ clones). Value is in minutes.
minimumReleaseAge: 1440

# Build scripts are blocked unless allowlisted here. esbuild needs its
# postinstall to fetch its native binary for Vite.
allowBuilds:
  esbuild: true

overrides:
  '@vitest/mocker@>=2.1.0 <4.1.11': ^4.1.11
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@<1.1.16: ^1.1.16
